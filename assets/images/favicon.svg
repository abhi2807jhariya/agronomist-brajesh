<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4828"/>
      <stop offset="100%" stop-color="#042714"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e8ae2c"/>
      <stop offset="100%" stop-color="#b47806"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#e8ae2c" stroke-width="2"/>

  <!-- Left Green Agricultural Leaf -->
  <path d="M 32,48 C 22,46 16,35 18,24 C 27,24 33,33 32,48 Z" fill="url(#leafGrad)"/>
  
  <!-- Right Golden Wheat Grains -->
  <!-- Stem -->
  <path d="M 32,50 Q 33,36 33,14" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Top Wheat Ear -->
  <ellipse cx="33" cy="14" rx="2.5" ry="4" fill="url(#goldGrad)"/>
  
  <!-- Side Wheat Grains -->
  <ellipse cx="37" cy="19" rx="2.5" ry="3.5" transform="rotate(30 37 19)" fill="url(#goldGrad)"/>
  <ellipse cx="29" cy="22" rx="2.5" ry="3.5" transform="rotate(-30 29 22)" fill="url(#goldGrad)"/>
  <ellipse cx="38" cy="26" rx="2.6" ry="3.6" transform="rotate(35 38 26)" fill="url(#goldGrad)"/>
  <ellipse cx="28" cy="30" rx="2.6" ry="3.6" transform="rotate(-35 28 30)" fill="url(#goldGrad)"/>
  <ellipse cx="38" cy="34" rx="2.6" ry="3.6" transform="rotate(40 38 34)" fill="url(#goldGrad)"/>
  <ellipse cx="28" cy="38" rx="2.6" ry="3.6" transform="rotate(-40 28 38)" fill="url(#goldGrad)"/>

  <!-- Golden Sprout Accent Base -->
  <circle cx="32" cy="49" r="2.2" fill="#e8ae2c"/>
</svg>
